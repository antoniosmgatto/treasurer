name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Read from .tool-versions, so asdf and CI cannot drift apart.
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The app consumes the engine packages' compiled output, so they have to be built first.
      # `next build` alone would compile against whatever dist happened to be lying around.
      - run: pnpm build:web
